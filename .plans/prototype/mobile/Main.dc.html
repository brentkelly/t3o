<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T3 board at phone width</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#18181b}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #fafafa; font-family: Inter, system-ui, sans-serif; color: #18181b; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; gap: 10px; padding: 10px 10px 4px 18px">
    <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em">T3</div>
    <div role="group" aria-label="View" style="display: flex; gap: 2px; padding: 3px; background: #efefee; border-radius: 12px">
      <button aria-label="Board view" aria-pressed="true" style="width: 44px; height: 38px; border: none; border-radius: 9px; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; color: #18181b; cursor: pointer">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16M15 4v16"></path></svg></button>
      <button aria-label="Outline view" aria-pressed="false" style="width: 44px; height: 38px; border: none; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center; color: #52525b; cursor: pointer">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 5h6M8 12h12M8 19h12M6 5v14"></path></svg></button>
      <button aria-label="Chat view" aria-pressed="false" style="width: 44px; height: 38px; border: none; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center; color: #52525b; cursor: pointer">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg></button>
    </div>
    <div style="flex-grow: 1"></div>
    <button aria-label="Workers and spend" style="width: 44px; height: 44px; border: 1px solid #d4d4d8; border-radius: 12px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #3f3f46; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></svg>
    </button>
  </header>

  <div style="display: flex; align-items: center; gap: 6px; padding: 6px 10px 10px 12px">
    <div style="flex-grow: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none">
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="5">
        <button onClick="{{p.pick}}" aria-pressed="{{p.active}}" style="flex-shrink: 0; height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; display: flex; align-items: center; gap: 7px; font: inherit; font-size: 14px; font-weight: {{p.weight}}; cursor: pointer">
          <span style="width: 11px; height: 3px; border-radius: 2px; background: {{p.dot}}"></span>{{p.label}}
        </button>
      </sc-for>
    </div>
    <sc-if value="{{anySelected}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{clearFilter}}" aria-label="Clear project filter" style="flex-shrink: 0; height: 40px; padding: 0 10px 0 8px; border: none; border-radius: 20px; background: #efefee; display: flex; align-items: center; gap: 4px; font: inherit; font-size: 13.5px; font-weight: 500; color: #27272a; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>{{selCount}}</button>
    </sc-if>
    <button aria-label="Archived cards" style="flex-shrink: 0; width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; color: #3f3f46; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"></path></svg>
    </button>
  </div>

  <main aria-label="Board columns" style="flex-grow: 1; min-height: 0; display: flex; gap: 10px; padding: 0 16px 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; scrollbar-width: none">
    <sc-for list="{{columns}}" as="col" hint-placeholder-count="3">
      <section style="flex: 0 0 318px; scroll-snap-align: start; display: flex; flex-direction: column; min-height: 0; background: #efefee; border-radius: 18px">
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 6px 6px 16px">
          <h2 style="margin: 0; font-size: 16px; font-weight: 600; color: #3f3f46; flex-grow: 1">{{col.name}}</h2>
          <span style="font-size: 13px; color: #52525b">{{col.count}}</span>
          <a href="NewCard.dc.html" aria-label="Add card to {{col.name}}" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #3f3f46">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
        </div>
        <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 0 8px 80px; display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="4">
            <a href="{{c.href}}" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #18181b; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 14px; padding: 12px 13px">
              <div style="display: flex; align-items: center; gap: 7px; flex-wrap: wrap">
                <span style="font-size: 12px; font-weight: 600; color: #ffffff; background: {{c.chip}}; border-radius: 6px; padding: 3px 7px">{{c.id}}</span>
                <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: {{c.labelFg}}; background: {{c.labelBg}}; border-radius: 6px; padding: 3px 7px">{{c.label}}</span>
                <div style="flex-grow: 1"></div>
                <sc-if value="{{c.high}}" hint-placeholder-val="{{ false }}">
                  <svg width="16" height="13" viewBox="0 0 18 14" role="img" aria-label="High priority"><rect x="1" y="8" width="3.5" height="6" rx="1" fill="#18181b"></rect><rect x="7" y="4" width="3.5" height="10" rx="1" fill="#18181b"></rect><rect x="13" y="0" width="3.5" height="14" rx="1" fill="#18181b"></rect></svg>
                </sc-if>
              </div>
              <div style="font-size: 15px; line-height: 1.38; font-weight: 500">{{c.title}}</div>
              <sc-if value="{{c.hasMeta}}" hint-placeholder-val="{{ false }}">
                <div style="font-size: 13px; color: #52525b">{{c.meta}}</div>
              </sc-if>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>

  <div style="position: absolute; left: 16px; bottom: 22px; display: flex; align-items: center; gap: 2px; padding: 4px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.12)">
    <sc-if value="{{toolsOpen}}" hint-placeholder-val="{{ false }}">
      <button aria-label="Settings" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #3f3f46; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg></button>
      <button aria-label="Pull requests" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #3f3f46; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4"></path></svg></button>
      <button aria-label="Stats" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #3f3f46; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 20V10M12 20V4M18 20v-7"></path></svg></button>
      <button aria-label="Push" style="width: 44px; height: 44px; border: none; background: #f0f0ef; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #18181b; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16V8M8.5 11.5 12 8l3.5 3.5"></path></svg></button>
    </sc-if>
    <button onClick="{{toggleTools}}" aria-label="{{toolsLabel}}" aria-expanded="{{toolsExpanded}}" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #3f3f46; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{toolsRotate}}"><path d="m9 6 6 6-6 6"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var P = {
      t3o: { label: 't3o', dot: '#c0904f', chip: '#85601f' },
      walls: { label: 'walls', dot: '#5bb5c9', chip: '#23687f' },
      z5: { label: 'z5', dot: '#7aa63a', chip: '#4a751c' },
      platinumhire: { label: 'platinumhire', dot: '#4aa58a', chip: '#24735c' },
      macjimray: { label: 'macjimray', dot: '#9b7fd6', chip: '#6a4fb0' }
    };
    var L = { BUG: ['#fde7e7', '#b42318'], EPIC: ['#e2f1ee', '#1d6a60'], FEATURE: ['#e6eefc', '#2850a8'] };
    var cols = [
      { name: 'Backlog', count: '34', cards: [
        { id: 'Z5-333', proj: 'z5', label: 'BUG', high: true, title: "check forgets its saved passes whenever xtask's tests run" },
        { id: 'Z5-334', proj: 'z5', label: 'BUG', high: true, title: 'A Cargo.lock change runs every check step' },
        { id: 'Z5-22', proj: 'z5', label: 'EPIC', title: '1.1 CMS core and admin' },
        { id: 'Z5-23', proj: 'z5', label: 'EPIC', title: '1.2 Hosting and deploy' },
        { id: 'Z5-24', proj: 'z5', label: 'EPIC', title: '1.3 Staff build kit' }
      ] },
      { name: 'Sprint', count: '9', cards: [
        { id: 'Z5-27', proj: 'z5', label: 'EPIC', title: '2.1 Client AI editing and support assistant level 2', meta: '1 linked' },
        { id: 'Z5-50', proj: 'z5', label: 'EPIC', title: '1.0: Launch checklist and "how we built site 1" write-up', meta: '4 linked · 1 comment' },
        { id: 'PLA-9', proj: 'platinumhire', label: 'EPIC', title: 'Stage 5: analytics client app', meta: '5 linked' }
      ] },
      { name: 'Planning', count: '1', cards: [
        { id: 'T3O-134', proj: 't3o', label: 'FEATURE', title: 'Mobile UI review', meta: 'Input needed · 1 comment' }
      ] },
      { name: 'Done', count: '96', cards: [
        { id: 'WAL-55', proj: 'walls', label: 'EPIC', title: 'Agentic spaces design & layout', meta: 'Group · 15 cards', href: 'CardEpic.dc.html' },
        { id: 'WAL-84', proj: 'walls', label: 'FEATURE', title: 'Additional site features: wind direction', meta: 'PR #135 · merged' }
      ] }
    ];
    var self = this;
    var sel = this.state.sel || [];
    var none = sel.length === 0;
    function show(c) { return none || sel.indexOf(c.proj) >= 0; }
    function tint(hex) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',0.16)'; }
    var columns = cols.map(function (col) {
      var shown = col.cards.filter(show);
      return { name: col.name, count: none ? col.count : String(shown.length), cards: shown.map(function (c) {
        return Object.assign({}, c, { chip: P[c.proj].chip, labelBg: L[c.label][0], labelFg: L[c.label][1],
          high: !!c.high, hasMeta: !!c.meta, href: c.href || 'CardDetail.dc.html' });
      }) };
    });
    var projects = Object.keys(P).map(function (k) {
      var on = sel.indexOf(k) >= 0;
      return { label: P[k].label, dot: P[k].dot, active: on ? 'true' : 'false',
        bg: on ? tint(P[k].dot) : (none ? '#ffffff' : 'transparent'),
        border: on ? P[k].dot : '#e4e4e7',
        fg: on ? '#18181b' : (none ? '#27272a' : '#71717a'),
        weight: on ? '600' : '500',
        pick: function () { self.setState({ sel: on ? sel.filter(function (x) { return x !== k; }) : sel.concat([k]) }); } };
    });
    var open = !!this.state.toolsOpen;
    return {
      columns: columns, projects: projects,
      anySelected: !none, selCount: String(sel.length),
      clearFilter: function () { self.setState({ sel: [] }); },
      toolsOpen: open, toolsExpanded: open ? 'true' : 'false',
      toolsLabel: open ? 'Collapse toolbar' : 'Expand toolbar',
      toolsRotate: open ? 'rotate(180deg)' : 'none',
      toggleTools: function () { self.setState({ toolsOpen: !open }); }
    };
  }
}
</script>
</body>
</html>
